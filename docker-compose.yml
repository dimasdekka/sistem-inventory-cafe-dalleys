version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: caffe_dalley_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-caffedalleydb}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/backups:/backups
    networks:
      - caffe_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASS:-rootpassword}",
        ]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: caffe_dalley_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASS:-rootpassword}
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    networks:
      - caffe_network
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local

networks:
  caffe_network:
    driver: bridge
